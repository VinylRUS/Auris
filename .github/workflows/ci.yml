name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo check --workspace --all-targets

      - name: Tests
        run: cargo test -p auris-api -p auris-core

  release:
    name: Build release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: auris-linux-x86_64
          - os: windows-latest
            artifact: auris-windows-x86_64
          - os: macos-latest
            artifact: auris-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p auris

      # ---------- Windows: установщик + портативный exe ----------
      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AURIS_VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          Write-Host "Version: $env:AURIS_VERSION"
          iscc /Qp installer\auris.iss
          Move-Item "installer\out\Auris-Setup-$($env:AURIS_VERSION)-x64.exe" "Auris-Setup-$($env:AURIS_VERSION)-x64.exe"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\release
          7z a ..\..\${{ matrix.artifact }}.zip auris.exe

      - name: Package (Unix)
        if: runner.os != 'Windows'
        # -C: архивируем без cd — относительные пути в actions чреваты
        # выходом за пределы workspace (было ../../../ = баг v0.0.1a)
        run: tar czf ${{ matrix.artifact }}.tar.gz -C target/release auris

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            Auris-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten and checksums
        run: |
          find dist -type f -exec mv {} . \;
          rm -rf dist
          sha256sum Auris-Setup-*.exe auris-*.tar.gz auris-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate latest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG")"
          python3 installer/make_manifest.py "$TAG" "$NOTES"

      - name: Release notes from tag
        id: notes
        run: |
          {
            echo 'body<<EOF'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            Auris-Setup-*.exe
            auris-*.tar.gz
            auris-*.zip
            latest.json
            SHA256SUMS.txt
